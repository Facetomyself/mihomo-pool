name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # native: 与 runner 架构一致，可以跑 -race 与完整测试
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            native: true
          - os: macos-latest
            goos: darwin
            goarch: arm64
            native: true
          - os: windows-latest
            goos: windows
            goarch: amd64
            native: true
          # 非 native: 只验证能编译出目标平台产物
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            native: false
          - os: macos-latest
            goos: darwin
            goarch: amd64
            native: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: gofmt
        if: matrix.os != 'windows-latest'
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "以下文件未格式化："
            echo "$out"
            exit 1
          fi

      - name: vet (native only)
        if: matrix.native
        run: go vet ./...

      # -race 依赖 cgo 且必须在原生架构上跑：在 x86 runner 上设
      # GOARCH=arm64 + CGO_ENABLED=1 会让链接器去汇编 ARM 指令集，直接
      # "no such instruction: stp x29,x30"。所以只在 runner 原生架构上跑测试，
      # 其它架构只做交叉编译。
      - name: test (race, native only)
        if: matrix.native
        run: go test -race -count=1 -timeout 300s ./...

      - name: build (cross)
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build ./...


  embedded:
    # 内嵌内核变体：不需要外部 mihomo 二进制，测试可以完整跑
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          # mihomo 有 170 个依赖，缓存对构建时间影响很大
          cache: true

      - name: vet (embedded)
        run: go vet -tags embedded ./...

      - name: test (embedded)
        run: go test -tags embedded -count=1 -timeout 600s ./...

      - name: 构建 embedded 二进制
        env:
          CGO_ENABLED: "0"
        run: |
          go build -tags embedded -ldflags="-s -w" -o /tmp/mihomo-pool-embedded ./cmd/mihomo-pool
          ls -lh /tmp/mihomo-pool-embedded
          # 内嵌版必须能在没有任何外部内核的机器上自报家门
          unset MIHOMO_POOL_BINARY
          /tmp/mihomo-pool-embedded version

      - name: 端到端（无外部内核）
        run: |
          # 用一个不存在的 Binary 明确证明：内嵌版不依赖外部 mihomo
          echo '[{"name":"n1","type":"socks5","server":"127.0.0.1","port":1}]' > /tmp/nodes.json
          rm -rf /tmp/embwork
          timeout 120 /tmp/mihomo-pool-embedded \
            -dir /tmp/embwork -socks 51890 -api 51891 -base 51900 \
            nodes -nodes /tmp/nodes.json | head -c 400
          echo
          timeout 60 /tmp/mihomo-pool-embedded \
            -dir /tmp/embwork2 -socks 52890 -api 52891 -base 52900 \
            status || true

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 客户端单测（对着桩程序跑协议）
        working-directory: python
        run: python -m unittest discover -s tests -v

      - name: 资源泄漏检查
        working-directory: python
        run: python -W error::ResourceWarning -m unittest discover -s tests

      - name: 语法检查
        run: python -m compileall -q python

  integration:
    # 真实内核的集成测试：在 Linux 上装 mihomo 后强跑
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: install mihomo
        # 不带认证的 api.github.com 在 CI 上容易触发 rate limit（VER 为空→下载失败），
        # 用内置 GITHUB_TOKEN 认证。
        run: |
          VER=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | grep -oP '"tag_name": "\K[^"]+')
          curl -sL -o mihomo.gz "https://github.com/MetaCubeX/mihomo/releases/download/${VER}/mihomo-linux-amd64-compatible-${VER}.gz"
          gunzip -f mihomo.gz
          chmod +x mihomo
          sudo mv mihomo /usr/local/bin/mihomo
          mihomo -v

      - name: integration test
        env:
          MIHOMO_POOL_INTEGRATION: "1"
        run: go test -race -run TestIntegration -v -count=1 -timeout 300s ./...
