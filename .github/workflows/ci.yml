name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # native: 与 runner 架构一致，可以跑 -race 与完整测试
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            native: true
          - os: macos-latest
            goos: darwin
            goarch: arm64
            native: true
          - os: windows-latest
            goos: windows
            goarch: amd64
            native: true
          # 非 native: 只验证能编译出目标平台产物
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            native: false
          - os: macos-latest
            goos: darwin
            goarch: amd64
            native: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: gofmt
        if: matrix.os != 'windows-latest'
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "以下文件未格式化："
            echo "$out"
            exit 1
          fi

      - name: vet (native only)
        if: matrix.native
        run: go vet ./...

      # -race 依赖 cgo 且必须在原生架构上跑：在 x86 runner 上设
      # GOARCH=arm64 + CGO_ENABLED=1 会让链接器去汇编 ARM 指令集，直接
      # "no such instruction: stp x29,x30"。所以只在 runner 原生架构上跑测试，
      # 其它架构只做交叉编译。
      - name: test (race, native only)
        if: matrix.native
        run: go test -race -count=1 -timeout 300s ./...

      - name: build (cross)
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build ./...


  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 客户端单测（对着桩程序跑协议）
        working-directory: python
        run: python -m unittest discover -s tests -v

      - name: 资源泄漏检查
        working-directory: python
        run: python -W error::ResourceWarning -m unittest discover -s tests

      - name: 语法检查
        run: python -m compileall -q python

  integration:
    # 真实内核的集成测试：在 Linux 上装 mihomo 后强跑
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: install mihomo
        run: |
          VER=$(curl -s https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | grep -oP '"tag_name": "\K[^"]+')
          curl -sL -o mihomo.gz "https://github.com/MetaCubeX/mihomo/releases/download/${VER}/mihomo-linux-amd64-compatible-${VER}.gz"
          gunzip -f mihomo.gz
          chmod +x mihomo
          sudo mv mihomo /usr/local/bin/mihomo
          mihomo -v

      - name: integration test
        env:
          MIHOMO_POOL_INTEGRATION: "1"
        run: go test -race -run TestIntegration -v -count=1 -timeout 300s ./...
