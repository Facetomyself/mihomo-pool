name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
          - os: macos-latest
            goos: darwin
            goarch: arm64
          - os: macos-latest
            goos: darwin
            goarch: amd64
          - os: windows-latest
            goos: windows
            goarch: amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: gofmt
        if: matrix.os != 'windows-latest'
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "以下文件未格式化："
            echo "$out"
            exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: test (race)
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "1"
        run: go test -race -count=1 -timeout 300s ./...

      - name: cross build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build ./...

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 客户端单测（对着桩程序跑协议）
        working-directory: python
        run: python -m unittest discover -s tests -v

      - name: 资源泄漏检查
        working-directory: python
        run: python -W error::ResourceWarning -m unittest discover -s tests

      - name: 语法检查
        run: python -m compileall -q python

  integration:
    # 真实内核的集成测试：在 Linux 上装 mihomo 后强跑
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: install mihomo
        run: |
          VER=$(curl -s https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | grep -oP '"tag_name": "\K[^"]+')
          curl -sL -o mihomo.gz "https://github.com/MetaCubeX/mihomo/releases/download/${VER}/mihomo-linux-amd64-compatible-${VER}.gz"
          gunzip -f mihomo.gz
          chmod +x mihomo
          sudo mv mihomo /usr/local/bin/mihomo
          mihomo -v

      - name: integration test
        env:
          MIHOMO_POOL_INTEGRATION: "1"
        run: go test -race -run TestIntegration -v -count=1 -timeout 300s ./...
